## IDF Component Manager Manifest File
## ESP-IDF 5.x Required for ESP32-C6 and Zigbee/Thread support

dependencies:
  # Espressif official components
  espressif/button: ^3.2.0
  espressif/iperf: ~0.1.1
  espressif/esp-modbus: ^2.0.2
  
  # IDF version requirement
  idf:
    version: ">=5.0.0"
  
  # Local components
  OTA:
    path: ../components/OTA
  ble_hid:
    path: ../components/ble_hid
  console:
    path: ../components/console
